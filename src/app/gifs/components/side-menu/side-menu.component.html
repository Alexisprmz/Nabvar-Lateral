<app-gifs-side-menu-header></app-gifs-side-menu-header>

<app-gifs-side-menu-options></app-gifs-side-menu-options>

<div class="mt-6 px-4">
  <div class="flex items-center gap-2 mb-4">
    <svg class="w-5 h-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">
      Historial de Búsqueda
    </h3>
  </div>

  <ul class="space-y-2">
    <li *ngFor="let query of apiService.searchHistory(); let i = index" 
        class="animate-slide-in"
        [style.animation-delay]="i * 0.05 + 's'">
      <button
        (click)="apiService.goToSearch(query)"
        class="group w-full text-left px-4 py-2.5 rounded-lg bg-slate-800/50 hover:bg-gradient-to-r hover:from-blue-600 hover:to-cyan-600 transition-all duration-300 flex items-center gap-3 border border-slate-700 hover:border-transparent hover:shadow-lg hover:scale-105"
      >
        <svg class="w-4 h-4 text-slate-500 group-hover:text-white transition-colors flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        
        <span class="text-sm text-slate-300 group-hover:text-white font-medium truncate transition-colors">
          {{ query }}
        </span>

        <svg class="w-4 h-4 text-slate-600 group-hover:text-white ml-auto flex-shrink-0 transform group-hover:translate-x-1 transition-all" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </button>
    </li>
  </ul>

  <div *ngIf="!apiService.searchHistory().length" class="text-center py-8">
    <svg class="w-12 h-12 text-slate-700 mx-auto mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
    </svg>
    <p class="text-xs text-slate-500 leading-relaxed">
      Aún no has realizado<br>ninguna búsqueda
    </p>
  </div>
</div>


<style>
@keyframes slide-in {
  from {
    opacity: 0;
    transform: translateX(-10px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

.animate-slide-in {
  animation: slide-in 0.3s ease-out forwards;
  opacity: 0;
}
</style>
