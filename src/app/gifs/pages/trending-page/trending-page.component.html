<div class="min-h-screen bg-gradient-to-br from-slate-50 via-gray-50 to-slate-100 p-4 md:p-6">
  <div class="max-w-7xl mx-auto">
 
    <div class="bg-white rounded-2xl md:rounded-3xl shadow-xl md:shadow-2xl p-4 md:p-8 mb-6 md:mb-8 border border-slate-200 relative overflow-hidden">
  
      <div class="absolute top-0 right-0 w-48 h-48 md:w-64 md:h-64 bg-gradient-to-br from-blue-500 to-cyan-500 opacity-10 rounded-full blur-3xl"></div>
      <div class="absolute bottom-0 left-0 w-48 h-48 md:w-64 md:h-64 bg-gradient-to-tr from-indigo-500 to-purple-500 opacity-10 rounded-full blur-3xl"></div>
      
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 relative z-10">
        <div>
          <h2 class="text-3xl md:text-5xl lg:text-6xl font-black bg-gradient-to-r from-blue-600 via-cyan-500 to-teal-500 bg-clip-text text-transparent mb-2 md:mb-3 drop-shadow-sm">
            {{ apiService.title() }}
          </h2>
          <div class="flex items-center gap-2">
            <div class="h-1 w-16 md:w-20 bg-gradient-to-r from-blue-600 to-cyan-500 rounded-full"></div>
            <p class="text-slate-600 text-sm md:text-base font-medium">Los GIFs más populares del momento 🔥</p>
          </div>
        </div>
        
        
        <button 
          (click)="refreshGifs()" 
          [disabled]="apiService.loading()"
          class="group relative bg-gradient-to-r from-blue-600 to-cyan-600 text-white px-5 md:px-6 py-2.5 md:py-3 rounded-lg md:rounded-xl font-semibold hover:from-blue-700 hover:to-cyan-700 disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2 md:gap-3 transition-all duration-300 shadow-lg hover:shadow-2xl hover:scale-105 disabled:hover:scale-100 text-sm md:text-base w-full sm:w-auto justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" 
               class="h-5 w-5 md:h-6 md:w-6 transition-transform duration-500 flex-shrink-0" 
               [class.animate-spin]="apiService.loading()" 
               viewBox="0 0 24 24" 
               fill="none" 
               stroke="currentColor" 
               stroke-width="2">
            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
          </svg>
          <span>{{ apiService.loading() ? 'Actualizando...' : 'Actualizar' }}</span>
        </button>
      </div>
    </div>

    <div *ngIf="apiService.loading()" class="bg-blue-50 border-2 border-blue-200 text-blue-700 font-medium mb-4 md:mb-6 p-3 md:p-4 rounded-xl md:rounded-2xl flex items-center gap-3 shadow-md text-sm md:text-base">
      <svg class="animate-spin h-5 w-5 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      Cargando GIFs increíbles...
    </div>

    <div *ngIf="apiService.error()" class="bg-red-50 border-2 border-red-200 text-red-700 font-semibold mb-4 md:mb-6 p-3 md:p-4 rounded-xl md:rounded-2xl flex items-center gap-3 shadow-md text-sm md:text-base">
      <svg class="h-5 w-5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
      </svg>
      {{ apiService.error() }}
    </div>

    <!-- MASONRY GRID -->
    <div *ngIf="!apiService.loading() && apiService.gifs().length" 
         class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-4">
      <div class="grid gap-3 md:gap-4" *ngFor="let column of [0, 1, 2, 3]">
        <div *ngFor="let gif of getGifsForColumn(column); let i = index"
             class="group relative bg-white rounded-xl md:rounded-2xl overflow-hidden border border-slate-200 shadow-md hover:shadow-2xl transition-all duration-300 hover:scale-[1.02] hover:border-blue-400 animate-fade-in cursor-pointer"
             [style.animation-delay]="(column + i * 4) * 0.05 + 's'">
          
          <div class="relative overflow-hidden">
            <img
              [src]="gif.images.fixed_height?.url || gif.images.original.url"
              [alt]="gif.title"
              class="w-full h-auto object-cover transition-transform duration-500 group-hover:scale-110"
            />
            
            <div class="absolute inset-0 bg-gradient-to-t from-slate-900/80 via-slate-900/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
            
            <div class="absolute bottom-0 left-0 right-0 p-3 md:p-4 text-white font-semibold text-xs md:text-sm transform translate-y-full group-hover:translate-y-0 transition-transform duration-300 line-clamp-2">
              {{ gif.title || 'Sin título' }}
            </div>
          </div>

          <div class="absolute top-2 md:top-3 right-2 md:right-3 bg-gradient-to-r from-orange-400 to-red-500 text-white text-[10px] md:text-xs font-bold px-2 md:px-3 py-1 rounded-full shadow-lg opacity-0 group-hover:opacity-100 transition-opacity duration-300">
            🔥
          </div>

          <div class="absolute inset-0 rounded-xl md:rounded-2xl bg-gradient-to-r from-blue-400/0 via-blue-400/5 to-cyan-400/0 opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none"></div>
        </div>
      </div>
    </div>

    <div *ngIf="!apiService.loading() && !apiService.gifs().length && !apiService.error()" 
         class="bg-white border border-slate-200 rounded-xl md:rounded-2xl shadow-lg p-8 md:p-12 text-center">
      <svg class="mx-auto h-12 w-12 md:h-16 md:w-16 text-slate-400 mb-3 md:mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <p class="text-slate-700 text-lg md:text-xl font-bold">No hay GIFs disponibles</p>
      <p class="text-slate-500 mt-2 text-sm md:text-base">Intenta actualizar en unos momentos</p>
    </div>
  </div>
</div>
