<div class="min-h-screen bg-gradient-to-br from-slate-50 via-gray-50 to-slate-100 p-6">
  <div class="max-w-7xl mx-auto">
    <!-- Header destacado -->
    <div class="bg-white rounded-3xl shadow-2xl p-8 mb-8 border-2 border-slate-200 relative overflow-hidden">
      <!-- Decoración de fondo -->
      <div class="absolute top-0 right-0 w-64 h-64 bg-gradient-to-br from-blue-500 to-cyan-500 opacity-10 rounded-full blur-3xl"></div>
      <div class="absolute bottom-0 left-0 w-64 h-64 bg-gradient-to-tr from-indigo-500 to-purple-500 opacity-10 rounded-full blur-3xl"></div>
      
      <div class="flex justify-between items-center relative z-10">
        <div>
          <h2 class="text-5xl md:text-6xl font-black bg-gradient-to-r from-blue-600 via-cyan-500 to-teal-500 bg-clip-text text-transparent mb-3 drop-shadow-sm">
            {{ apiService.title() }}
          </h2>
          <div class="flex items-center gap-2">
            <div class="h-1 w-20 bg-gradient-to-r from-blue-600 to-cyan-500 rounded-full"></div>
            <p class="text-slate-600 text-base font-medium">Los GIFs más populares del momento 🔥</p>
          </div>
        </div>
        
        <!-- Botón de actualizar -->
        <button 
          (click)="refreshGifs()" 
          [disabled]="apiService.loading()"
          class="group relative bg-gradient-to-r from-blue-600 to-cyan-600 text-white px-6 py-3 rounded-xl font-semibold hover:from-blue-700 hover:to-cyan-700 disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-3 transition-all duration-300 shadow-lg hover:shadow-2xl hover:scale-105 disabled:hover:scale-100">
          <svg xmlns="http://www.w3.org/2000/svg" 
               class="h-6 w-6 transition-transform duration-500" 
               [class.animate-spin]="apiService.loading()" 
               viewBox="0 0 24 24" 
               fill="none" 
               stroke="currentColor" 
               stroke-width="2">
            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
          </svg>
          <span class="hidden sm:inline">{{ apiService.loading() ? 'Actualizando...' : 'Actualizar' }}</span>
        </button>
      </div>
    </div>

    <!-- Mensajes de estado -->
    <div *ngIf="apiService.loading()" class="bg-blue-50 border-2 border-blue-200 text-blue-700 font-medium mb-6 p-4 rounded-2xl flex items-center gap-3 shadow-md">
      <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      Cargando GIFs increíbles...
    </div>

    <div *ngIf="apiService.error()" class="bg-red-50 border-2 border-red-200 text-red-700 font-semibold mb-6 p-4 rounded-2xl flex items-center gap-3 shadow-md">
      <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
      </svg>
      {{ apiService.error() }}
    </div>

    <!-- Grid de GIFs -->
    <div *ngIf="!apiService.loading() && apiService.gifs().length" 
         class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <div *ngFor="let gif of apiService.gifs(); let i = index" 
           class="group relative bg-white rounded-2xl p-3 border-2 border-slate-200 shadow-lg hover:shadow-2xl transition-all duration-300 hover:scale-105 hover:border-blue-400 animate-fade-in"
           [style.animation-delay]="i * 0.05 + 's'">
        
        <!-- Imagen del GIF -->
        <div class="relative overflow-hidden rounded-xl">
          <img
            [src]="gif.images.fixed_height?.url || gif.images.original.url"
            [alt]="gif.title"
            class="w-full h-48 object-cover transition-transform duration-500 group-hover:scale-110"
          />
          
          <!-- Overlay con gradiente -->
          <div class="absolute inset-0 bg-gradient-to-t from-slate-900/70 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
          
          <!-- Título sobre la imagen (visible en hover) -->
          <div class="absolute bottom-0 left-0 right-0 p-4 text-white font-semibold text-sm transform translate-y-full group-hover:translate-y-0 transition-transform duration-300">
            {{ gif.title || 'Sin título' }}
          </div>
        </div>

        <!-- Badge decorativo -->
        <div class="absolute top-6 right-6 bg-gradient-to-r from-orange-400 to-red-500 text-white text-xs font-bold px-3 py-1 rounded-full shadow-lg opacity-0 group-hover:opacity-100 transition-opacity duration-300">
          TRENDING 🔥
        </div>

        <!-- Efecto de brillo en hover -->
        <div class="absolute inset-0 rounded-2xl bg-gradient-to-r from-blue-400/0 via-blue-400/10 to-cyan-400/0 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
      </div>
    </div>

    <!-- Mensaje cuando no hay GIFs -->
    <div *ngIf="!apiService.loading() && !apiService.gifs().length && !apiService.error()" 
         class="bg-white border-2 border-slate-200 rounded-2xl shadow-xl p-12 text-center">
      <svg class="mx-auto h-16 w-16 text-slate-400 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <p class="text-slate-700 text-xl font-bold">No hay GIFs disponibles</p>
      <p class="text-slate-500 mt-2">Intenta actualizar en unos momentos</p>
    </div>
  </div>
</div>

<!-- Estilos CSS adicionales para la animación -->
<style>
@keyframes fade-in {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.animate-fade-in {
  animation: fade-in 0.5s ease-out forwards;
  opacity: 0;
}
</style>
